# Deploys the Stage Deck Planner to GitHub Pages as a static site.
#
# One-time setup in your GitHub repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# The site is served at https://<user>.github.io/<repo-name>/ — the base path
# is computed from the repository name automatically, so no manual edits are
# needed. (For a user/organization repo named <user>.github.io the base is "/".)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          GHPAGES_BASE: /${{ github.event.repository.name }}/

      # Collect the static site into one folder (output location differs by
      # environment), add a client-side routing fallback and disable Jekyll.
      - name: Prepare static site
        run: |
          if [ -f .output/public/index.html ]; then SRC=.output/public
          elif [ -f dist/client/index.html ]; then SRC=dist/client
          else echo "No index.html found in build output"; ls -R .output dist 2>/dev/null | head -50; exit 1; fi
          mkdir -p site
          cp -r "$SRC"/. site/
          cp site/index.html site/404.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
