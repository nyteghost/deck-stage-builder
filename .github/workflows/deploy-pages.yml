# Deploys the Stage Deck Planner to GitHub Pages as a static site.
#
# One-time setup in your GitHub repo:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# The site is served at https://<user>.github.io/<repo-name>/ — the base path
# is computed from the repository name automatically, so no manual edits are
# needed. (For a user/organization repo named <user>.github.io the base is "/".)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          GHPAGES_BASE: /${{ github.event.repository.name }}/

      # Client-side routing fallback: any unknown URL serves the app.
      - name: Add 404 fallback
        run: cp dist/client/index.html dist/client/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
